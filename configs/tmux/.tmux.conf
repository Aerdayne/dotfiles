# Taken from https://github.com/atidyshirt/MacOS-Dotfiles/blob/master/.tmux.conf
# The comment above a binding is its label in the Hyper + Space overlay

set-option -g prefix C-z
# Send prefix key
bind C-z send-prefix

set-option -g set-titles on
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# The status bar only lists windows, so show it only once a session has more than one
# (https://www.reddit.com/r/tmux/comments/6lwb07/is_it_possible_to_hide_the_status_bar_in_only_a/dpzr5d7/)
if -F "#{==:#{session_windows},1}" "set -g status off" "set -g status on"
set-hook -g window-linked 'if -F "#{==:#{session_windows},1}" "set -g status off" "set -g status on"'
set-hook -g window-unlinked 'if -F "#{==:#{session_windows},1}" "set -g status off" "set -g status on"'

# Closing a terminal window, or switching it to another session, leaves its session running unseen
set-hook -g client-detached 'run-shell -b ~/.tmux/scripts/close-idle-sessions.sh'
set-hook -g client-session-changed 'run-shell -b ~/.tmux/scripts/close-idle-sessions.sh'

set -g renumber-windows off
set -g automatic-rename off
set-option -g -q mouse on

setw -g mode-keys vi

unbind s
# Enter copy mode
bind s copy-mode

# Begin selection, as in Vim
bind-key -T copy-mode-vi 'v' send -X begin-selection
# Copy selection to clipboard
bind-key -T copy-mode-vi 'y' send -X copy-pipe "pbcopy"

# Copy selection to clipboard and exit copy mode
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi 'Enter' send -X copy-pipe-and-cancel "pbcopy"

set -g base-index 1
setw -g aggressive-resize on
set -sg escape-time 0

# Reload tmux config
bind r source-file ~/.tmux.conf

# Resize pane left
bind -r H resize-pane -L 5
# Resize pane down
bind -r J resize-pane -D 5
# Resize pane up
bind -r U resize-pane -U 5
# Resize pane right
bind -r K resize-pane -R 5

# Split pane vertically
bind v split-window -h -c "#{pane_current_path}"
# Split pane horizontally
bind h split-window -v -c "#{pane_current_path}"
# New window
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Kill current pane
bind x kill-pane
# Toggle status bar
bind t set status

# Previous window
bind-key -n C-p prev
# Next window
bind-key -n C-n next

# Session picker (fuzzy search project dirs)
bind f run-shell "bash ~/.tmux/scripts/sessionizer.sh"

# Styling: plain pane borders, and the status bar as one dot per window
set -g pane-border-style fg=brightblack
set -g pane-active-border-style fg=brightblack

set -g status-bg black
set -g status-fg white

set -g status-right ""
set -g status-left ""

set -g status-justify centre

set -g window-status-current-format "●"
set -g window-status-format "○"
