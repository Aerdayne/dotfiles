---
- defaults:
    link:
      create: true
      relink: true
    shell:
      stdout: true
      stderr: true

- clean:
    ~/:
    ~/.config:
    ~/.config/fish:
    ~/.config/fish/conf.d:
    ~/.config/alacritty:

- create:
    - "~/.config"
    - "~/.config/fish"
    - "~/.config/alacritty"

- link:
    ~/.config/fish/config.fish:
      path: configs/fish/config.fish
      force: true
    ~/.config/fish/fish_plugins:
      path: configs/fish/fish_plugins
      force: true
    ~/.config/fish/conf.d:
      path: configs/fish/conf.d
      force: true
    ~/.config/fish/themes:
      path: configs/fish/themes
      force: true
    ~/.config/alacritty/alacritty.toml:
      path: configs/alacritty/alacritty.toml
      force: true
    ~/.config/starship.toml: configs/starship/starship.toml

- shell:
    - command: /bin/bash -c 'if grep --fixed-strings --line-regexp /opt/homebrew/bin/fish /etc/shells; then echo 0; else /bin/bash -c "echo /opt/homebrew/bin/fish | sudo tee -a /etc/shells"; fi'
      description: Add fish to /etc/shells if not added already

- shell:
    - command: /bin/bash -c '[ "$(dscl . -read "/Users/$(id -un)" UserShell | cut -d " " -f 2)" = /opt/homebrew/bin/fish ] || chsh -s /opt/homebrew/bin/fish'
      description: Change default shell to fish if it isn't already (chsh asks for the password)

- shell:
    - command: /bin/bash -c 'if /opt/homebrew/bin/fish -c "type -q fisher"; then echo 0; else /opt/homebrew/bin/fish -c "curl -sL https://raw.githubusercontent.com/jorgebucaran/fisher/main/functions/fisher.fish | source && fisher install jorgebucaran/fisher"; fi'
      description: Install fisher

- shell:
    - command: /bin/bash -c '/opt/homebrew/bin/fish -c "fisher update"'
      description: Download fisher packages listed in fish_plugins
