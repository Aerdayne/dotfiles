---
- defaults:
    link:
      create: true
      relink: true
    shell:
      stdout: true
      stderr: true

- clean:
    ~/:
    ~/.config:
    ~/.hammerspoon:
    ~/Library/Application Support/k9s:
    ~/Library/Application Support/k9s/skins:

- create:
    - "~/.config"
    - "~/.hammerspoon"
    - "~/Library/Application Support/Code/User"
    - "~/Library/Application Support/k9s/skins"
    - "~/.tmux/scripts"

- link:
    "~/Library/Application Support/Code/User/settings.json": configs/vscode/settings.json
    "~/Library/Application Support/Code/User/keybindings.json": configs/vscode/keybindings.json
    "~/Library/Application Support/k9s/config.yaml": configs/k9s/config.yaml
    "~/Library/Application Support/k9s/skins/gruvbox-dark.yaml": configs/k9s/skins/gruvbox-dark.yaml
    ~/.yabairc: configs/yabai/.yabairc
    ~/.config/yabai/refresh-moved-spaces.sh: configs/yabai/refresh-moved-spaces.sh
    ~/.config/yabai/focus-adjacent-space.sh: configs/yabai/focus-adjacent-space.sh
    ~/.config/yabai/focus-pane-or-window.sh: configs/yabai/focus-pane-or-window.sh
    ~/.config/yabai/sync-true-tone.js: configs/yabai/sync-true-tone.js
    ~/.config/yabai/recreate-space.sh: configs/yabai/recreate-space.sh
    ~/.config/yabai/fix-notch-shield.sh: configs/yabai/fix-notch-shield.sh
    ~/.skhdrc: configs/skhd/.skhdrc
    ~/.hammerspoon/init.lua: configs/hammerspoon/init.lua
    ~/.hammerspoon/shortcuts.lua: configs/hammerspoon/shortcuts.lua
    ~/.hammerspoon/menu-shortcuts.swift: configs/hammerspoon/menu-shortcuts.swift
    ~/.tmux.conf: configs/tmux/.tmux.conf
    ~/.tmux/scripts/sessionizer.sh: configs/tmux/scripts/sessionizer.sh
    ~/.tmux/scripts/close-idle-sessions.sh: configs/tmux/scripts/close-idle-sessions.sh
    ~/.tmux/scripts/save-sessions.sh: configs/tmux/scripts/save-sessions.sh
    ~/.tmux/scripts/restore-sessions.sh: configs/tmux/scripts/restore-sessions.sh
    ~/.local/bin/moonlander: configs/moonlander/moonlander
    ~/.config/mise/config.toml: configs/mise/config.toml
    ~/.config/git/config: configs/git/config
    ~/.config/git/ignore: configs/git/ignore
    ~/.local/bin/git-account: configs/git/git-account
    ~/.local/bin/gh: configs/git/gh

- shell:
  - command: '[ -f ~/.config/git/accounts/default ] || echo "No git accounts on this Mac yet: see configs/git/README.md"'
    description: Check for git accounts
  - command: bash -l './configs/vscode/install_extensions.sh'
    description: Install VSCode extensions
